name: Run one private SA validation task
description: Checks out private SA source and executes one isolated task on the public Ubuntu runner
inputs:
  repository:
    description: Private source repository; defaults to the SA private repository
    required: false
    default: SpineAnimator/spine-animator-private
  task:
    description: Fixed task identifier from the public workflow matrix
    required: true
  ref:
    description: Private source branch or commit
    required: false
    default: main
  source-token:
    description: Optional private checkout credential; defaults to the caller GITHUB_TOKEN
    required: false
    default: ''
  rust:
    description: Whether the Rust WASM target toolchain is required
    required: false
    default: 'false'
  python-version:
    description: Python version for source validation task
    required: false
    default: '3.11'
  persist-credentials:
    description: Persist caller credentials in the private checkout only for tasks that must push to the caller repository
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prove public runner allocation
      shell: bash
      run: |
        set -euo pipefail
        echo "executor_repository=SpineAnimator/2Spine-visual-audit"
        echo "runner_name=$RUNNER_NAME"
        echo "runner_os=$RUNNER_OS"
        echo "runner_arch=$RUNNER_ARCH"
        uname -a
    - name: Checkout private SA source
      id: private_source
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.source-token || github.token }}
        path: private-source
        persist-credentials: ${{ inputs.persist-credentials }}
    - name: Record exact private source revision
      id: private_revision
      shell: bash
      working-directory: private-source
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install locked private Node dependencies
      shell: bash
      working-directory: private-source
      run: npm ci
    - name: Set up Rust for WASM/core jobs
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Validate public task dispatcher syntax
      shell: bash
      run: bash -n scripts/run-private-validation.sh
    - name: Execute migrated private workflow task
      shell: bash
      env:
        SA_TASK: ${{ inputs.task }}
        SA_SOURCE_DIR: private-source
        GITHUB_SHA: ${{ steps.private_revision.outputs.sha }}
        SA_PRIVATE_SHA: ${{ steps.private_revision.outputs.sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set +e
        runner_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        private_log="$RUNNER_TEMP/sa-private-task.log"
        bash "$runner_root/scripts/run-private-validation.sh" >"$private_log" 2>&1
        task_status=$?
        set -e
        echo "task=${{ inputs.task }}"
        echo "private_source_sha=${{ steps.private_revision.outputs.sha }}"
        echo "task_exit_code=$task_status"
        # Public runner logs contain only numeric test summaries, never raw
        # private-source test output, paths, fixture data, or exception payloads.
        grep -E '^# (tests|pass|fail|skipped) [0-9]+$|^Ran [0-9]+ tests?$|^OK$|^FAILED|^PRIVATE_STAGE_[a-z0-9_]+_EXIT=[0-9]+
        if [ "$task_status" -ne 0 ]; then
          grep -E '^not ok [0-9]+ - ' "$private_log" | cut -c1-180 || true
        fi
        rm -f "$private_log"
        exit "$task_status"
