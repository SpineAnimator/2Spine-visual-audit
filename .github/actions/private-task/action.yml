name: Run one private SA validation task
description: Checks out private SA source and executes one isolated task on the public Ubuntu runner
inputs:
  task:
    description: Fixed task identifier from the public workflow matrix
    required: true
  ref:
    description: Private source branch or commit
    required: true
  source-token:
    description: Read-only credential for the private source checkout
    required: true
  rust:
    description: Whether the Rust WASM target toolchain is required
    required: false
    default: 'false'
  python-version:
    description: Python version for source validation task
    required: false
    default: '3.11'
runs:
  using: composite
  steps:
    - name: Prove public runner allocation
      shell: bash
      run: |
        set -euo pipefail
        echo "executor_repository=SpineAnimator/2Spine-visual-audit"
        echo "runner_name=$RUNNER_NAME"
        echo "runner_os=$RUNNER_OS"
        echo "runner_arch=$RUNNER_ARCH"
        uname -a
    - name: Checkout private SA source
      id: private_source
      uses: actions/checkout@v4
      with:
        repository: SpineAnimator/spine-animator-private
        ref: ${{ inputs.ref }}
        token: ${{ inputs.source-token }}
        path: private-source
        persist-credentials: false
    - name: Record exact private source revision
      id: private_revision
      shell: bash
      working-directory: private-source
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install locked private Node dependencies
      shell: bash
      working-directory: private-source
      run: npm ci
    - name: Set up Rust for WASM/core jobs
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Validate public task dispatcher syntax
      shell: bash
      run: bash -n scripts/run-private-validation.sh
    - name: Execute migrated private workflow task
      shell: bash
      env:
        SA_TASK: ${{ inputs.task }}
        SA_SOURCE_DIR: private-source
        GITHUB_SHA: ${{ steps.private_revision.outputs.sha }}
        SA_PRIVATE_SHA: ${{ steps.private_revision.outputs.sha }}
        SA_SOURCE_TOKEN: ${{ inputs.source-token }}
      run: |
        set -euo pipefail
        private_log="$RUNNER_TEMP/sa-private-task.log"
        trap 'rm -f "$private_log"' EXIT
        set +e
        bash scripts/run-private-validation.sh >"$private_log" 2>&1
        task_status=$?
        set -e
        echo "task=${{ inputs.task }}"
        echo "private_source_sha=${{ steps.private_revision.outputs.sha }}"
        echo "task_exit_code=$task_status"
        # Emit only aggregate numeric summaries. Never print private test names,
        # source paths, fixture data, stack traces, or exception payloads.
        grep -E '^# (tests|pass|fail|skipped) [0-9]+$|^Ran [0-9]+ tests? in [0-9.]+s$|^OK$|^FAILED|^PRIVATE_STAGE_[a-z0-9_]+_EXIT=[0-9]+$|^SOURCE_TOKEN_SCOPE_AUDIT .*|^PRIVATE_OPEN_ISSUE_AUDIT .*' "$private_log" || true
        exit "$task_status"
