name: 3Spine public executor workflow contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-public-executor.yml'
      - '.github/workflows/3spine-public-executor-contract.yml'
      - 'tests/test_3spine_public_executor_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Lint public executor orchestration on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Validate public workflow and reusable job dispatch contracts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/3spine-public-executor.yml
