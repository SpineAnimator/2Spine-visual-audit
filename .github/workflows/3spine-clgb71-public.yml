name: CLGB71 licensed Spine Editor gate on public Ubuntu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-clgb71-public.yml'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Exact successful source ZIP workflow run
        required: false
        type: string
        default: ''
      expected_source_sha:
        description: Exact source commit SHA for the selected ZIP
        required: false
        type: string
        default: ''
  repository_dispatch:
    types: [3spine-clgb71-editor]
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-clgb71-licensed-editor
  cancel-in-progress: false
jobs:
  public-ubuntu-probe:
    name: Allocate public GitHub-hosted Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public runner allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          grep -q 'Ubuntu 24.04' /etc/os-release
          echo "PUBLIC_CLGB71_UBUNTU_RUNNER=$RUNNER_NAME"
          echo 'PUBLIC_CLGB71_UBUNTU_24_04_PASS' >> "$GITHUB_STEP_SUMMARY"
  licensed-editor-secrets:
    name: Check licensed Editor configuration without exposing secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Require source access and licensed Editor configuration
        id: probe
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in SOURCE_REPO_TOKEN SPINE_LICENSE SPINE_LINUX_URL; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'CLGB71_EDITOR_WAITING_FOR_PUBLIC_REPOSITORY_SECRETS' >> "$GITHUB_STEP_SUMMARY"
            printf 'Missing configuration: %s\\n' "${missing[*]}"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
  native-editor:
    name: Licensed CLGB71 native import/export on public Ubuntu
    needs:
      - public-ubuntu-probe
      - licensed-editor-secrets
    if: needs.licensed-editor-secrets.outputs.ready == 'true'
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-clgb71-licensed-editor.yml@c97ca5157dec6f1883f041f25789f3ae62a3209a
    with:
      artifact_run_id: ${{ github.event.client_payload.artifact_run_id || inputs.artifact_run_id || '' }}
      expected_source_sha: ${{ github.event.client_payload.expected_source_sha || inputs.expected_source_sha || '' }}
    secrets:
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
