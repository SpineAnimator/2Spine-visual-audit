name: 2Spine private-source CI on public runners
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2spine-private-ci.yml'
  schedule:
    - cron: '17 * * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite
        required: true
        default: all
        type: choice
        options: [all, test, linux, macos]
permissions:
  contents: read
jobs:
  python-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'test'
    name: Python tests (${{ matrix.python-version }}) • private source / public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout private 2Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/2Spine
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-2spine
          persist-credentials: false
      - name: Record exact private source revision
        working-directory: private-2spine
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "2SPINE_PRIVATE_SOURCE_SHA=$source_sha" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install private project dependencies
        working-directory: private-2spine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null 2>&1
          if ! python -m pip install --disable-pip-version-check pytest Pillow >"$RUNNER_TEMP/2spine-pip-install.log" 2>&1; then
            echo "2SPINE_TEST_DEPENDENCY_INSTALL_FAILED python=${{ matrix.python-version }}"
            tail -n 30 "$RUNNER_TEMP/2spine-pip-install.log"
            exit 1
          fi
      - name: Verify Python annotation compatibility and converter imports
        working-directory: private-2spine
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python - <<'PY'
          import sys
          sys.path.insert(0, "source/tools")
          import spine_binary_to_spine
          import cross_folder_resolver
          import restore_names_cli
          print("2SPINE_PYTHON_IMPORT_COMPATIBILITY_PASS")
          PY
      - name: Run tests and emit aggregate-only diagnostics
        working-directory: private-2spine
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/2spine-junit.xml"
          set +e
          pytest -q --tb=no --junitxml="$report" >"$RUNNER_TEMP/2spine-pytest.log" 2>&1
          result=$?
          set -e
          python - "$report" "${{ matrix.python-version }}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, version = sys.argv[1:]
          try:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              total = sum(int(x.get("tests", 0)) for x in suites)
              failures = sum(int(x.get("failures", 0)) for x in suites)
              errors = sum(int(x.get("errors", 0)) for x in suites)
              skipped = sum(int(x.get("skipped", 0)) for x in suites)
              print(f"2SPINE_PYTEST_SUMMARY python={version} tests={total} failures={failures} errors={errors} skipped={skipped}")
              import re
              for case in root.iter("testcase"):
                  for item in case:
                      if item.tag in ("error", "failure"):
                          message = (item.get("message") or "").splitlines()[0][:240]
                          details = (item.text or "").strip().splitlines()
                          cause = next((line.strip() for line in reversed(details) if ":" in line), "")
                          origin = next((line.strip() for line in details if line.strip().startswith("File ")), "")
                          message = re.sub(r"/(?:home|Users|tmp)/[^ ]+", "<path>", message)
                          cause = re.sub(r"/(?:home|Users|tmp)/[^ ]+", "<path>", cause)[:240]
                          origin = re.sub(r"/(?:home|Users|tmp)/[^ ]+", "<path>", origin)[:240]
                          print(f"2SPINE_TEST_DIAGNOSTIC python={version} type={item.tag} origin={origin} cause={cause}")
          except Exception:
              print(f"2SPINE_PYTEST_REPORT_MISSING python={version}")
          PY
          if [ "$result" -ne 0 ]; then
            echo "2SPINE_PYTEST_EXIT python=${{ matrix.python-version }} code=$result"
            exit "$result"
          fi
  linux-converter:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'linux'
    name: Linux converter • private source / public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private 2Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/2Spine
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-2spine
          persist-credentials: false
      - name: Checkout pinned converter source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/SpineSkeletonDataConverter
          ref: 64796e00e6a84f597cf87cb116a1069eb80a5126
          path: build_tool
          fetch-depth: 1
          persist-credentials: false
      - name: Build Linux converter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential >/dev/null
          cmake -S build_tool -B build_tool/build_linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build_tool/build_linux --parallel --target SpineSkeletonDataConverter
          test -x build_tool/build_linux/SpineSkeletonDataConverter
          echo "2SPINE_LINUX_CONVERTER_BUILD_PASS"
  macos-app:
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'macos'))
    name: macOS app bundle • private source / public macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private 2Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/2Spine
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-2spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private project dependencies
        working-directory: private-2spine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null 2>&1
          if ! python -m pip install --disable-pip-version-check pyinstaller Pillow tkinterdnd2 >"$RUNNER_TEMP/2spine-macos-pip-install.log" 2>&1; then
            echo "2SPINE_MACOS_BUILD_DEPENDENCY_INSTALL_FAILED"
            tail -n 30 "$RUNNER_TEMP/2spine-macos-pip-install.log"
            exit 1
          fi
      - name: Build and verify macOS app without publishing private artifacts
        working-directory: private-2spine
        shell: bash
        run: |
          set -euo pipefail
          if ! pyinstaller --clean --noconfirm "source/Spine Project Packager.spec" >"$RUNNER_TEMP/2spine-pyinstaller.log" 2>&1; then
            echo "2SPINE_MACOS_APP_BUILD_FAILED"
            exit 1
          fi
          test -d "dist/2Spine.app"
          echo "2SPINE_MACOS_APP_BUILD_PASS"
