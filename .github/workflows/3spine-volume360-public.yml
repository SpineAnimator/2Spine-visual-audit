name: Volume360 licensed Spine Editor gate on public Ubuntu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-volume360-public.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [3spine-volume360-editor]
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-volume360-licensed-editor
  cancel-in-progress: false
jobs:
  public-ubuntu-probe:
    name: Allocate public GitHub-hosted Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public runner allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          grep -q 'Ubuntu 24.04' /etc/os-release
          echo "PUBLIC_VOLUME360_UBUNTU_RUNNER=$RUNNER_NAME"
          echo 'PUBLIC_VOLUME360_UBUNTU_24_04_PASS' >> "$GITHUB_STEP_SUMMARY"
  licensed-editor-secrets:
    name: Check licensed Editor configuration without exposing secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Require source access and licensed Editor configuration
        id: probe
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in SOURCE_REPO_TOKEN SPINE_LICENSE SPINE_LINUX_URL; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'VOLUME360_EDITOR_WAITING_FOR_PUBLIC_REPOSITORY_SECRETS' >> "$GITHUB_STEP_SUMMARY"
            printf 'Missing configuration: %s\\n' "${missing[*]}"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
  real-volume360-editor:
    name: Real Spine 4.3.26 import/export on public Ubuntu
    needs:
      - public-ubuntu-probe
      - licensed-editor-secrets
    if: needs.licensed-editor-secrets.outputs.ready == 'true'
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-volume360-licensed-editor.yml@4c692dc3f235257569e921eb7887316c8b8da936
    secrets:
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
