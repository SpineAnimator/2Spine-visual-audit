name: Migrated private SA jobs on public Ubuntu
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sa-private-workflow-matrix.yml'
      - '.github/actions/private-task/action.yml'
      - 'scripts/run-private-validation.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sa-private-workflow-matrix.yml'
      - '.github/actions/private-task/action.yml'
      - 'scripts/run-private-validation.sh'
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Which migrated job group to execute
        required: true
        default: unit
        type: choice
        options:
          - all
          - unit
          - live
          - expensive
          - extended
permissions:
  contents: read
concurrency:
  group: sa-migrated-private-jobs
  cancel-in-progress: false
jobs:
  unit-jobs:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'unit'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: pose-director
            ref: main
            timeout: 12
            rust: false
          - task: psd-cache-unit
            ref: main
            timeout: 5
            rust: false
          - task: runtime-contact
            ref: main
            timeout: 8
            rust: false
          - task: site-command
            ref: main
            timeout: 12
            rust: false
          - task: rust-core
            ref: main
            timeout: 20
            rust: true
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}


  reviewer-contract:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Catbox reviewer contract • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: catbox-review-download
          ref: feat/catbox-review-download-contract
          rust: false
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  live-jobs:
    if: github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'live'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: catbox-diagnostic
            ref: main
            timeout: 6
            rust: false
          - task: catbox-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: cherry-mirror-audit
            ref: main
            timeout: 5
            rust: false
          - task: cloud-smoke
            ref: main
            timeout: 8
            rust: false
          - task: drive-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: mcp-real-psd
            ref: main
            timeout: 15
            rust: false
          - task: mcp-source-smoke
            ref: main
            timeout: 6
            rust: false
          - task: mcp-zip-live
            ref: main
            timeout: 6
            rust: false
          - task: nf4g80-probe
            ref: main
            timeout: 6
            rust: false
          - task: psd-cloud-smoke
            ref: main
            timeout: 12
            rust: false
          - task: psd-route-audit
            ref: main
            timeout: 10
            rust: false
          - task: recover-zombie-source
            ref: main
            timeout: 6
            rust: false
          - task: storage-diagnostic
            ref: main
            timeout: 5
            rust: false
          - task: zombie-psd
            ref: main
            timeout: 10
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  extended-jobs:
    if: inputs.group == 'all' || inputs.group == 'extended'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: full-node-tests
            ref: main
            timeout: 25
            rust: false
          - task: asset-transport-unit
            ref: main
            timeout: 15
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  expensive-jobs:
    if: inputs.group == 'all' || inputs.group == 'expensive'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: browser-smoke
            ref: main
            timeout: 15
            rust: false
          - task: psd-1000
            ref: main
            timeout: 60
            rust: false
          - task: zombie-spine-e2e
            ref: main
            timeout: 25
            rust: false
          - task: clgb71-ik-build
            ref: main
            timeout: 25
            rust: false
          - task: volume360
            ref: main
            timeout: 20
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}
