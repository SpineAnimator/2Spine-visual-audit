name: Migrated private SA jobs on public Ubuntu
on:
  pull_request:
    paths:
      - '.github/workflows/sa-private-workflow-matrix.yml'
      - '.github/actions/private-task/action.yml'
      - 'scripts/run-private-validation.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sa-private-workflow-matrix.yml'
      - '.github/actions/private-task/action.yml'
      - 'scripts/run-private-validation.sh'
  schedule:
    - cron: '*/15 * * * *'
    - cron: '43 */2 * * *'
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      group:
        description: Which migrated job group to execute
        required: true
        default: unit
        type: choice
        options:
          - all
          - unit
          - live
          - expensive
permissions:
  contents: read
concurrency:
  group: sa-migrated-private-jobs
  cancel-in-progress: false
jobs:
  sa-dispatch-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: SA → 3Spine dispatch contract • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact private SA integration branch
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/spine-animator-private
          ref: feat/dispatch-clgb71-to-3spine-editor-v2
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-sa
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Validate private workflow with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml private-sa/.github/workflows/clgb71-original-ik-zip.yml
      - name: Validate exact metadata-only dispatch payload
        shell: bash
        env:
          WORKFLOW: private-sa/.github/workflows/clgb71-original-ik-zip.yml
        run: |
          set -euo pipefail
          grep -Fq "github.ref == 'refs/heads/main'" "$WORKFLOW"
          grep -Fq "artifact_run_id: String(context.runId)" "$WORKFLOW"
          grep -Fq "expected_source_sha: context.sha" "$WORKFLOW"
          grep -Fq "event_type: 'sa-clgb71-editor'" "$WORKFLOW"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync(process.env.WORKFLOW, 'utf8');
          const match = source.match(/const payload = \{([\s\S]*?)\n\s*\};/);
          if (!match) throw new Error('Dispatch payload block not found');
          if (/SPINE_LICENSE|SPINE_LINUX_URL|\.psd|\.zip/i.test(match[1])) {
            throw new Error('Dispatch payload contains a private asset or license reference');
          }
          for (const key of ['source_repo:', 'artifact_run_id:', 'expected_source_sha:']) {
            if (!match[1].includes(key)) throw new Error('Missing payload field: ' + key);
          }
          console.log('SA_3SPINE_DISPATCH_STATIC_CONTRACT_PASS');
          NODE

  sa-3spine-receiver-contract:
    name: 3Spine licensed Editor receiver contract • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public validation harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact 3Spine receiver branch
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main # Validate the merged, trusted 3Spine receiver on every public-runner pass.
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false
      - name: Set up Go for pinned actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Validate receiver workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 3spine/.github/workflows/verify-clgb71-editor-linux.yml
      - name: Validate exact dispatch trust boundary and Ubuntu runner contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=3spine/.github/workflows/verify-clgb71-editor-linux.yml
          grep -Fq 'repository_dispatch:' "$workflow"
          grep -Fq 'types: [sa-clgb71-editor]' "$workflow"
          grep -Fq "github.event.sender.login == 'vladleopold'" "$workflow"
          grep -Fq "github.event.client_payload.source_repo == 'SpineAnimator/spine-animator-private'" "$workflow"
          grep -Fq 'github.event.client_payload.artifact_run_id' "$workflow"
          grep -Fq 'github.event.client_payload.expected_source_sha' "$workflow"
          grep -Fq 'runs-on: [self-hosted, linux, X64]' "$workflow"
          grep -Fq '(.head_branch == "main")' "$workflow"
          grep -Fq '(.event == "push" or .event == "workflow_dispatch")' "$workflow"
          bash -n 3spine/setup/check_runner.sh 3spine/setup/up.sh
          grep -Fq 'docker compose up -d runner' 3spine/setup/up.sh
          grep -Fq 'bash "$DIR/setup/check_runner.sh"' 3spine/setup/up.sh
          grep -Fq 'RUNNER_NAME="${RUNNER_NAME:-spine-linux-x64}"' 3spine/setup/check_runner.sh
          grep -Fq 'index("self-hosted") != null' 3spine/setup/check_runner.sh
          grep -Fq 'index("linux") != null' 3spine/setup/check_runner.sh
          grep -Fq 'index("X64") != null' 3spine/setup/check_runner.sh
          echo 'THREESPINE_RECEIVER_AND_RUNNER_CONTRACT_PASS'
  reviewer-contract:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Catbox reviewer contract • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: catbox-review-download
          ref: feat/catbox-review-download-contract
          rust: false
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  clgb71-recovery-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: clgb71 recovery probe • read-only Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: clgb71-recovery-probe
          ref: main
          rust: false
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  unit-jobs:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'unit'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: pose-director
            ref: main
            timeout: 12
            rust: false
          - task: psd-cache-unit
            ref: main
            timeout: 5
            rust: false
          - task: python-psd-validation
            ref: main
            timeout: 20
            rust: false
            python-version: '3.12'
          - task: runtime-contact
            ref: main
            timeout: 8
            rust: false
          - task: site-command
            ref: main
            timeout: 12
            rust: false
          - task: rust-core
            ref: main
            timeout: 20
            rust: true
          - task: full-node-tests
            ref: main
            timeout: 35
            rust: false
          - task: asset-transport-unit
            ref: main
            timeout: 20
            rust: false
          - task: asset-transport-feature-validation
            ref: feat/sa-core-vision-animation-planner
            timeout: 20
            rust: false
          - task: semantic-contour-validation
            ref: feat/sa-core-vision-animation-planner
            timeout: 40
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          python-version: ${{ matrix.python-version || '3.11' }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  archive-validation:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'unit'
    name: private task archive integrity • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private animation archive without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/spine-animation-library
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-animation-library
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every immutable private archive branch and its task hashes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archive_refs < <(git -C private-animation-library for-each-ref --format='%(refname)' refs/remotes/origin/archive/)
          if [ "${#archive_refs[@]}" -eq 0 ]; then
            echo "PRIVATE_ARCHIVE_BRANCHES_MISSING"
            exit 1
          fi
          verified=0
          for ref in "${archive_refs[@]}"; do
            worktree="$RUNNER_TEMP/archive-check-$verified"
            log="$RUNNER_TEMP/archive-check-$verified.log"
            git -C private-animation-library worktree add --detach "$worktree" "$ref" >/dev/null
            set +e
            (cd "$worktree" && python scripts/verify_task_archive.py) >"$log" 2>&1
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              echo "PRIVATE_ARCHIVE_VALIDATION_FAILED"
              echo "exit_code=$result"
              git -C private-animation-library worktree remove --force "$worktree" >/dev/null || true
              rm -f "$log"
              exit "$result"
            fi
            count=$(sed -nE 's/^Verified ([0-9]+) task revision manifest\(s\); all listed files match size and SHA-256\.$/\1/p' "$log")
            if [ -z "$count" ] || [ "$count" -eq 0 ]; then
              echo "PRIVATE_ARCHIVE_VALIDATOR_RETURNED_ZERO_MANIFESTS"
              git -C private-animation-library worktree remove --force "$worktree" >/dev/null || true
              rm -f "$log"
              exit 1
            fi
            verified=$((verified + count))
            git -C private-animation-library worktree remove --force "$worktree" >/dev/null
            rm -f "$log"
          done
          echo "PRIVATE_ARCHIVE_BRANCHES_VERIFIED=${#archive_refs[@]}"
          echo "PRIVATE_TASK_MANIFESTS_VERIFIED=$verified"

  live-jobs:
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '43 */2 * * *') || inputs.group == 'all' || inputs.group == 'live'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: browser-smoke
            ref: main
            timeout: 15
            rust: false
          - task: catbox-diagnostic
            ref: main
            timeout: 6
            rust: false
          - task: catbox-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: catbox-review-download
            ref: feat/catbox-review-download-contract
            timeout: 10
            rust: false
          - task: clgb71-recovery-probe
            ref: main
            timeout: 8
            rust: false
          - task: cloud-smoke
            ref: main
            timeout: 8
            rust: false
          - task: drive-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: mcp-real-psd
            ref: main
            timeout: 15
            rust: false
          - task: mcp-source-smoke
            ref: main
            timeout: 6
            rust: false
          - task: mcp-zip-live
            ref: main
            timeout: 6
            rust: false
          - task: nf4g80-probe
            ref: main
            timeout: 6
            rust: false
          - task: psd-cloud-smoke
            ref: main
            timeout: 12
            rust: false
          - task: psd-route-audit
            ref: main
            timeout: 10
            rust: false
          - task: recover-zombie-source
            ref: main
            timeout: 6
            rust: false
          - task: storage-diagnostic
            ref: main
            timeout: 5
            rust: false
          - task: zombie-psd
            ref: main
            timeout: 10
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  expensive-jobs:
    if: inputs.group == 'all' || inputs.group == 'expensive' || (github.event_name == 'schedule' && github.event.schedule == '23 3 * * 0')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: psd-1000
            ref: main
            timeout: 60
            rust: false
          - task: zombie-spine-e2e
            ref: main
            timeout: 25
            rust: false
          - task: clgb71-ik-build
            ref: main
            timeout: 25
            rust: false
          - task: volume360
            ref: main
            timeout: 20
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}
