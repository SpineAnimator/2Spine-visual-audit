name: Migrated private SA jobs on public Ubuntu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sa-private-workflow-matrix.yml'
      - '.github/actions/private-task/action.yml'
      - 'scripts/run-private-validation.sh'
  schedule:
    - cron: '*/15 * * * *'
    - cron: '43 */2 * * *'
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      group:
        description: Which migrated job group to execute
        required: true
        default: unit
        type: choice
        options:
          - all
          - unit
          - live
          - expensive
permissions:
  contents: read
concurrency:
  group: sa-migrated-private-jobs
  cancel-in-progress: false
jobs:
  unit-jobs:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'unit'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: pose-director
            ref: main
            timeout: 12
            rust: false
          - task: psd-cache-unit
            ref: main
            timeout: 5
            rust: false
          - task: runtime-contact
            ref: main
            timeout: 8
            rust: false
          - task: site-command
            ref: main
            timeout: 12
            rust: false
          - task: rust-core
            ref: main
            timeout: 20
            rust: true
          - task: full-node-tests
            ref: main
            timeout: 35
            rust: false
          - task: asset-transport-unit
            ref: main
            timeout: 20
            rust: false
          - task: semantic-contour-validation
            ref: feat/sa-core-vision-animation-planner
            timeout: 40
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  archive-validation:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == 'unit'
    name: private task archive integrity • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private animation archive without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/spine-animation-library
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-animation-library
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every immutable private archive branch and its task hashes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archive_refs < <(git -C private-animation-library for-each-ref --format='%(refname)' refs/remotes/origin/archive/)
          if [ "${#archive_refs[@]}" -eq 0 ]; then
            echo "PRIVATE_ARCHIVE_BRANCHES_MISSING"
            exit 1
          fi
          verified=0
          for ref in "${archive_refs[@]}"; do
            worktree="$RUNNER_TEMP/archive-check-$verified"
            log="$RUNNER_TEMP/archive-check-$verified.log"
            git -C private-animation-library worktree add --detach "$worktree" "$ref" >/dev/null
            set +e
            (cd "$worktree" && python scripts/verify_task_archive.py) >"$log" 2>&1
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              echo "PRIVATE_ARCHIVE_VALIDATION_FAILED"
              echo "exit_code=$result"
              git -C private-animation-library worktree remove --force "$worktree" >/dev/null || true
              rm -f "$log"
              exit "$result"
            fi
            count=$(sed -nE 's/^Verified ([0-9]+) task revision manifest\(s\); all listed files match size and SHA-256\.$/\1/p' "$log")
            if [ -z "$count" ] || [ "$count" -eq 0 ]; then
              echo "PRIVATE_ARCHIVE_VALIDATOR_RETURNED_ZERO_MANIFESTS"
              git -C private-animation-library worktree remove --force "$worktree" >/dev/null || true
              rm -f "$log"
              exit 1
            fi
            verified=$((verified + count))
            git -C private-animation-library worktree remove --force "$worktree" >/dev/null
            rm -f "$log"
          done
          echo "PRIVATE_ARCHIVE_BRANCHES_VERIFIED=${#archive_refs[@]}"
          echo "PRIVATE_TASK_MANIFESTS_VERIFIED=$verified"

  live-jobs:
    if: github.event_name == 'schedule' && github.event.schedule == '43 */2 * * *' || inputs.group == 'all' || inputs.group == 'live'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task: browser-smoke
            ref: main
            timeout: 15
            rust: false
          - task: catbox-diagnostic
            ref: main
            timeout: 6
            rust: false
          - task: catbox-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: cherry-mirror-audit
            ref: main
            timeout: 5
            rust: false
          - task: cloud-smoke
            ref: main
            timeout: 8
            rust: false
          - task: drive-source-smoke
            ref: main
            timeout: 5
            rust: false
          - task: mcp-real-psd
            ref: main
            timeout: 15
            rust: false
          - task: mcp-source-smoke
            ref: main
            timeout: 6
            rust: false
          - task: mcp-zip-live
            ref: main
            timeout: 6
            rust: false
          - task: nf4g80-probe
            ref: main
            timeout: 6
            rust: false
          - task: psd-cloud-smoke
            ref: main
            timeout: 12
            rust: false
          - task: psd-route-audit
            ref: main
            timeout: 10
            rust: false
          - task: recover-zombie-source
            ref: main
            timeout: 6
            rust: false
          - task: storage-diagnostic
            ref: main
            timeout: 5
            rust: false
          - task: zombie-psd
            ref: main
            timeout: 10
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}

  expensive-jobs:
    if: inputs.group == 'all' || inputs.group == 'expensive' || (github.event_name == 'schedule' && github.event.schedule == '23 3 * * 0')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: psd-1000
            ref: main
            timeout: 60
            rust: false
          - task: zombie-spine-e2e
            ref: main
            timeout: 25
            rust: false
          - task: clgb71-ik-build
            ref: main
            timeout: 25
            rust: false
          - task: volume360
            ref: main
            timeout: 20
            rust: false
    name: ${{ matrix.task }} • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: ${{ matrix.task }}
          ref: ${{ matrix.ref }}
          rust: ${{ matrix.rust }}
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}
