name: 3Spine Saver seven-site self-test • public Ubuntu
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-saver-selftest-public.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: 3spine-saver-seven-site-public
  cancel-in-progress: false
jobs:
  public-ubuntu-saver-suite:
    name: Run private 3Spine saver suite on public GitHub-hosted Ubuntu
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-saver-selftest.yml@fcee8c23f4b2ad116dc12f0b57f426dde1d658ce
    secrets:
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
