name: NVIDIA SkillSpector public catalog scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-skillspector-public.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-skillspector-public.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-skillspector-public
  cancel-in-progress: true

env:
  NVIDIA_SKILLS_COMMIT: d7e1e2c728579ad38174443ef22382d0fb4615b5
  SKILLSPECTOR_COMMIT: e2674da339b0bddc6e565d059c0577c6d9cd25da

jobs:
  scan:
    name: Static SkillSpector scan of pinned NVIDIA skills
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact NVIDIA skill catalog revision
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/skills
          ref: ${{ env.NVIDIA_SKILLS_COMMIT }}
          path: nvidia-skills
          sparse-checkout: |
            nv-agent-root-cert.pem
            skills/cdf-auto-labeling
            skills/cdf-augmentation
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout pinned NVIDIA SkillSpector
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/SkillSpector
          ref: ${{ env.SKILLSPECTOR_COMMIT }}
          path: skillspector-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage NVIDIA skills with immutable image overlay and referenced cookbooks
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/nvidia-skill-scan"
          mkdir -p "$stage/cdf-auto-labeling" "$stage/cdf-augmentation"
          cp -R nvidia-skills/skills/cdf-auto-labeling/. "$stage/cdf-auto-labeling/"
          cp -R nvidia-skills/skills/cdf-augmentation/. "$stage/cdf-augmentation/"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "nvidia-skill-scan/cdf-augmentation/references/event-video-gen.md"
          text = p.read_text()
          old = "  cdf-augmentation:latest"
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one mutable cdf-augmentation:latest launch reference")
          text = text.replace(old, '  "$CDF_IMAGE_ID"')
          marker = "docker run --rm -it \\\n"
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one event-video-gen docker launch block")
          text = text.replace(
              marker,
              ': "${CDF_IMAGE_ID:?Set this to the verified immutable sha256 image ID from the canonical build workflow}"\n' + marker,
              1,
          )
          p.write_text(text)
          print("IMMUTABLE_CDF_IMAGE_OVERLAY_APPLIED")
          PY

      - name: Install binary-only OMS verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: model-signing==1.1.1 certifi pyOpenSSL

      - name: Verify NVIDIA OMS signatures
        shell: bash
        run: |
          set -euo pipefail
          for skill in cdf-auto-labeling cdf-augmentation; do
            skill_dir="nvidia-skills/skills/$skill"
            test -s "$skill_dir/SKILL.md"
            test -s "$skill_dir/skill.oms.sig"
            model_signing verify certificate "$skill_dir" \
              --signature "$skill_dir/skill.oms.sig" \
              --certificate_chain nvidia-skills/nv-agent-root-cert.pem
          done

      - name: Install pinned SkillSpector
        id: install-skillspector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nvidia-logs
          python -m venv "$RUNNER_TEMP/skillspector-venv"
          "$RUNNER_TEMP/skillspector-venv/bin/python" -m pip install --disable-pip-version-check ./skillspector-src 2>&1 | tee nvidia-logs/skillspector-install.log
          test -x "$RUNNER_TEMP/skillspector-venv/bin/skillspector"
          "$RUNNER_TEMP/skillspector-venv/bin/skillspector" --help >/dev/null
          echo "$RUNNER_TEMP/skillspector-venv/bin" >> "$GITHUB_PATH"

      - name: Scan selected skills (static, fail closed on incomplete analysis)
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for skill in cdf-auto-labeling cdf-augmentation; do
            if skillspector scan "$RUNNER_TEMP/nvidia-skill-scan/$skill" \
              --no-llm \
              --fail-on-incomplete \
              --format json \
              --output "$RUNNER_TEMP/$skill-skillspector.json"; then
              echo "SKILLSPECTOR_PASS=$skill"
            else
              rc=$?
              echo "SKILLSPECTOR_FAIL=$skill exit=$rc"
              failed=1
            fi
          done
          test "$failed" -eq 0
          echo "NVIDIA_SKILLSPECTOR_SCAN_COMPLETE"

      - name: Generate reviewed cdf-augmentation baseline candidate
        if: always() && steps.install-skillspector.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          skillspector baseline "$RUNNER_TEMP/nvidia-skill-scan/cdf-augmentation" \
            --no-llm \
            --reason "Reviewed static false positives: .env appears only in guidance against committing secrets; docker run tokens are either multiline command prefixes followed by an immutable CDF_IMAGE_ID or evaluation prose; world-writable appears only in warnings prohibiting it. No executable credential access or unsafe defaults were found." \
            --output "$RUNNER_TEMP/cdf-augmentation-baseline.yaml"

      - name: Upload reviewable baseline candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-skillspector-baseline-candidate
          path: ${{ runner.temp }}/cdf-augmentation-baseline.yaml
          if-no-files-found: warn

      - name: Upload SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-skillspector-reports
          path: ${{ runner.temp }}/*-skillspector.json
          if-no-files-found: warn

      - name: Upload SkillSpector diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-skillspector-diagnostics
          path: nvidia-logs/
          if-no-files-found: warn
