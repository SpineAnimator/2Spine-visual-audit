name: NVIDIA SkillSpector public catalog scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-skillspector-public.yml"
      - "nvidia-skillspector-baselines/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-skillspector-public
  cancel-in-progress: true

env:
  NVIDIA_SKILLS_COMMIT: d7e1e2c728579ad38174443ef22382d0fb4615b5
  SKILLSPECTOR_COMMIT: e2674da339b0bddc6e565d059c0577c6d9cd25da

jobs:
  scan:
    name: Static SkillSpector scan of pinned NVIDIA skills
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact NVIDIA skill catalog revision
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/skills
          ref: ${{ env.NVIDIA_SKILLS_COMMIT }}
          path: nvidia-skills
          sparse-checkout: |
            nv-agent-root-cert.pem
            skills/cdf-auto-labeling
            skills/cdf-augmentation
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout pinned NVIDIA SkillSpector
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/SkillSpector
          ref: ${{ env.SKILLSPECTOR_COMMIT }}
          path: skillspector-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage NVIDIA skills with immutable image overlay and referenced cookbooks
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/nvidia-skill-scan"
          mkdir -p "$stage/cdf-auto-labeling" "$stage/cdf-augmentation"
          cp -R nvidia-skills/skills/cdf-auto-labeling/. "$stage/cdf-auto-labeling/"
          cp -R nvidia-skills/skills/cdf-augmentation/. "$stage/cdf-augmentation/"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "nvidia-skill-scan/cdf-augmentation/references/event-video-gen.md"
          text = p.read_text()
          old = "  cdf-augmentation:latest"
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one mutable cdf-augmentation:latest launch reference")
          text = text.replace(old, '  "$CDF_IMAGE_ID"')
          marker = "docker run --rm -it \\\n"
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one event-video-gen docker launch block")
          text = text.replace(
              marker,
              ': "${CDF_IMAGE_ID:?Set this to the verified immutable sha256 image ID from the canonical build workflow}"\n' + marker,
              1,
          )
          p.write_text(text)
          print("IMMUTABLE_CDF_IMAGE_OVERLAY_APPLIED")
          PY

      - name: Install binary-only OMS verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: model-signing==1.1.1 certifi pyOpenSSL

      - name: Verify NVIDIA OMS signatures
        shell: bash
        run: |
          set -euo pipefail
          for skill in cdf-auto-labeling cdf-augmentation; do
            skill_dir="nvidia-skills/skills/$skill"
            test -s "$skill_dir/SKILL.md"
            test -s "$skill_dir/skill.oms.sig"
            model_signing verify certificate "$skill_dir" \
              --signature "$skill_dir/skill.oms.sig" \
              --certificate_chain nvidia-skills/nv-agent-root-cert.pem
          done

      - name: Install pinned SkillSpector
        id: install-skillspector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nvidia-logs
          python -m pip install --disable-pip-version-check ./skillspector-src 2>&1 | tee nvidia-logs/skillspector-install.log

      - name: Scan selected skills (static; completeness enforced by reviewed policy)
        shell: bash
        run: |
          set -euo pipefail
          skillspector scan "$RUNNER_TEMP/nvidia-skill-scan/cdf-auto-labeling" \
            --no-llm \
            --format json \
            --output "$RUNNER_TEMP/cdf-auto-labeling-skillspector.json"
          test -s "$GITHUB_WORKSPACE/nvidia-skillspector-baselines/cdf-augmentation.yaml"
          skillspector scan "$RUNNER_TEMP/nvidia-skill-scan/cdf-augmentation" \
            --no-llm \
            --baseline "$GITHUB_WORKSPACE/nvidia-skillspector-baselines/cdf-augmentation.yaml" \
            --show-suppressed \
            --format json \
            --output "$RUNNER_TEMP/cdf-augmentation-skillspector.json"
          echo "NVIDIA_SKILLSPECTOR_SCAN_COMPLETE"

      - name: Enforce reviewed SkillSpector completeness and finding policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          def report(name):
              path = root / f"{name}-skillspector.json"
              if not path.is_file():
                  raise SystemExit(f"Missing SkillSpector report: {path.name}")
              return json.loads(path.read_text(encoding="utf-8"))

          auto = report("cdf-auto-labeling")
          completeness = auto.get("analysis_completeness") or {}
          expected_auto = {
              ("reference_missing", "SKILL.md", 41, False),
              ("referenced_uninspected", "SKILL.md", 43, False),
              ("reference_missing", "SKILL.md", 103, False),
              ("reference_missing", "SKILL.md", 111, False),
              ("reference_missing", "SKILL.md", 117, False),
          }
          actual_auto = {
              (item.get("reason_code"), item.get("path"), item.get("start_line"), item.get("fatal"))
              for item in (completeness.get("ledger_exceptions") or [])
          }
          auto_ok = (
              auto.get("execution_successful") is True
              and completeness.get("execution_successful") is True
              and completeness.get("total_components") == 48
              and completeness.get("scanned_components") == 48
              and completeness.get("coverage_percent") == 100.0
              and completeness.get("fully_inspected_files") == 48
              and completeness.get("partially_inspected_files") == 0
              and completeness.get("entirely_uninspected_files") == 0
              and not auto.get("issues")
              and (auto.get("risk_assessment") or {}).get("score") == 0
              and (auto.get("risk_assessment") or {}).get("max_issue_severity") == "NONE"
              and actual_auto == expected_auto
          )
          if not auto_ok:
              raise SystemExit("cdf-auto-labeling failed the reviewed security/coverage policy")
          print("CDF_AUTO_LABELING_POLICY_PASS: 48/48 components, zero findings, five exact non-fatal documentation caveats")

          augmentation = report("cdf-augmentation")
          aug = augmentation.get("analysis_completeness") or {}
          expected_aug_lines = {55, 57, 59, 62, 63, 64, 71, 79, 81, 82, 85, 86, 277, 293, 296, 299, 321}
          actual_aug = {
              (item.get("reason_code"), item.get("path"), item.get("start_line"), item.get("fatal"))
              for item in (aug.get("ledger_exceptions") or [])
          }
          expected_aug = {("reference_missing", "SKILL.md", line, False) for line in expected_aug_lines}
          aug_risk = augmentation.get("risk_assessment") or {}
          aug_ok = (
              augmentation.get("execution_successful") is True
              and aug.get("execution_successful") is True
              and aug.get("is_complete") is True
              and aug.get("coverage_percent") == 100.0
              and aug.get("partially_inspected_files") == 0
              and aug.get("entirely_uninspected_files") == 0
              and actual_aug == expected_aug
              and not augmentation.get("issues")
              and aug_risk.get("score") == 0
              and aug_risk.get("max_issue_severity") == "NONE"
          )
          if not aug_ok:
              raise SystemExit(
                  "cdf-augmentation failed reviewed baseline/security policy: "
                  + json.dumps({
                      "active_issues": augmentation.get("issues"),
                      "suppressed_count": augmentation.get("suppressed_count"),
                      "exceptions": sorted(actual_aug),
                      "risk": aug_risk,
                  }, sort_keys=True)
              )
          print(
              "CDF_AUGMENTATION_POLICY_PASS: 100% coverage, zero active findings, "
              f"{augmentation.get('suppressed_count', 0)} exact reviewed false-positive occurrences suppressed, "
              "17 exact non-fatal runtime-path caveats"
          )
          print("SKILLSPECTOR_COMPLETENESS_AND_FINDING_POLICY_PASS")
          PY

      - name: Upload SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-skillspector-reports
          path: ${{ runner.temp }}/*-skillspector.json
          if-no-files-found: warn

      - name: Upload SkillSpector diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-skillspector-diagnostics
          path: nvidia-logs/
          if-no-files-found: warn
