name: Last-seven real archive audit • public Ubuntu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-last7-real-preview-public.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [3spine-last7-real-preview]
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-last-seven-real-preview
  cancel-in-progress: false
jobs:
  last-seven:
    name: Audit private 3Spine archives and live pages on public Ubuntu
    uses: SpineAnimator/Spine-Link-project-export/.github/workflows/last7-real-preview.yml@fb1e53622fec42c290839eed1e6e0780b2e63200
    with:
      source-repository: vladleopold/3Spine-core
      source-ref: main
    secrets: inherit
