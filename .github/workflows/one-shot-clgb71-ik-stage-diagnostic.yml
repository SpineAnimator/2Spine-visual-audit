name: One-shot private CLGB71 stage diagnosis
on:
  push:
    branches:
      - task/clgb71-ik-stage-diagnostic-20261123
    paths:
      - 'ci/trigger-clgb71-ik-stage-diagnostic.txt'
permissions:
  contents: read
concurrency:
  group: clgb71-ik-stage-diagnostic
  cancel-in-progress: false
jobs:
  clgb71-ik-build:
    name: CLGB71 IK isolated stages • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: clgb71-ik-build
          ref: main
          rust: false
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}
