name: Public runner migration smoke (current private source)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-runner-migration-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ubuntu-probe:
    name: Verify this public repository received an ephemeral Ubuntu 24.04 runner
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify runner allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          grep -q 'Ubuntu 24.04' /etc/os-release
          echo "Public repository: $GITHUB_REPOSITORY"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          uname -a
          echo 'PUBLIC_REPOSITORY_UBUNTU_24_04_PASS' >> "$GITHUB_STEP_SUMMARY"

  legacy-runner-decommission-contract:
    name: Assert private runner infrastructure is fully removed from 3Spine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory every remaining private-source workflow job with runs-on
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path("3spine/.github")
          files = sorted(root.rglob("*.yml")) + sorted(root.rglob("*.yaml"))
          print(f"PRIVATE_GITHUB_DIR_EXISTS={root.exists()}")
          print(f"PRIVATE_WORKFLOW_FILES_TOTAL={len(files)}")
          for path in files:
              print(f"PRIVATE_WORKFLOW_FILE {path}")
          if not files:
              raise SystemExit("No private-source workflow YAML files were found; refusing to report a clean inventory")
          found = []
          for path in files:
              current_job = None
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  job = re.match(r"^  ([A-Za-z0-9_-]+):\s*$", line)
                  if job:
                      current_job = job.group(1)
                  runner = re.match(r"^    runs-on:\s*(.*)$", line)
                  if runner and current_job:
                      found.append((path.as_posix(), current_job, runner.group(1).strip() or "<multiline>"))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "private-workflow-inventory.log"), "w", encoding="utf-8") as inventory:
              for path, job, runner in found:
                  line = f"PRIVATE_WORKFLOW_RUNS_ON {path}:{job} = {runner}"
                  print(line)
                  inventory.write(line + "\n")
          print(f"PRIVATE_WORKFLOW_RUNS_ON_TOTAL={len(found)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Private-source workflow execution inventory\n")
              summary.write(f"Explicit runs-on jobs found: **{len(found)}**\n\n")
              for path, job, runner in found:
                  summary.write(f"- `{path}` · `{job}` · `{runner}`\n")
          PY
          if [ "$(grep -c '^PRIVATE_WORKFLOW_RUNS_ON ' "$RUNNER_TEMP/private-workflow-inventory.log" 2>/dev/null || true)" -gt 0 ]; then
            echo "::error::Private source still defines executable workflow jobs; move them to public executors."
            exit 1
          fi
      - name: Run public-only infrastructure contract
        run: python 3spine/tests/test_spine_archive_runner_config.py

  spine-link-full-cloud:
    name: Spine-Link full cloud E2E on public Ubuntu
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-spine-link-full-cloud-e2e.yml@3287c762031f22db0b589de80a0914143847563a
    secrets: inherit

  spine-link-computer-health:
    name: Spine-Link Ubuntu computer health on public Ubuntu
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-spine-link-computer-worker-health.yml@5eb2a5d0fb98a4330e2e9b86f65cac831f3712c3
    secrets: inherit

  spine-converter:
    name: 3Spine converter on public Ubuntu
    uses: SpineAnimator/sa-public-runner/.github/workflows/3spine-converter-test.yml@5eb2a5d0fb98a4330e2e9b86f65cac831f3712c3
    secrets: inherit

  psd-private-source:
    name: PSD/PSB validation from private source on public Ubuntu
    uses: SpineAnimator/sa-psd-tool-runner/.github/workflows/psd-validation.yml@14ab734df00e2efaa95e0463645bcfb48891c20f
    with:
      source-repository: SpineAnimator/spine-animator-private
      source-ref: main
    secrets: inherit

  spine-link-project-export:
    name: Spine-Link private project export checks on public Ubuntu
    uses: SpineAnimator/Spine-Link-project-export/.github/workflows/runner.yml@2b076cd3a9ae0b76c60bf538bcf470bf43f197f5
    secrets: inherit

  private-storage-source-access:
    name: Verify scoped public-runner token can read private Spine storage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout private Spine storage using the inherited read token
        uses: actions/checkout@v4
        with:
          repository: vladleopold/spine
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-storage
          persist-credentials: false
          sparse-checkout: |
            library_02/index.json
          sparse-checkout-cone-mode: false
      - name: Verify private source was checked out without printing contents
        shell: bash
        run: |
          set -euo pipefail
          test -s private-storage/library_02/index.json
          echo 'PUBLIC_RUNNER_TOKEN_PRIVATE_STORAGE_READ_PASS' >> "$GITHUB_STEP_SUMMARY"

  # E2E validates the deployed Pages UI IDs and strict Spine 4.3 ZIP manifest.
  public-site-psd-e2e:
    name: Public site PSD-to-ZIP browser E2E on public Ubuntu
    uses: SpineAnimator/sa-psd-tool-runner/.github/workflows/psd-validation.yml@51fc9293326fde4afbe6079bbc2a45b6828a5964
    with:
      source-repository: vladleopold/3Spine-core
      source-ref: main
      suite: public-site-e2e
    secrets: inherit
