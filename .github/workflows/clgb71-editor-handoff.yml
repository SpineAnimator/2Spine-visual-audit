name: Dispatch verified clgb71 source to licensed 3Spine editor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clgb71-editor-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch latest verified private source artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
          script: |
            const source = { owner: 'SpineAnimator', repo: 'spine-animator-private' };
            const target = { owner: 'vladleopold', repo: '3Spine-core' };
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...source,
                workflow_id: 'clgb71-original-ik-zip.yml',
                branch: 'main',
                status: 'success',
                per_page: 20
              });
              const run = runs.data.workflow_runs.find(item =>
                item.conclusion === 'success' &&
                item.head_branch === 'main' &&
                item.event === 'push'
              );
              if (!run) {
                core.setFailed('No successful main-branch clgb71 source ZIP run is available.');
                return;
              }
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...source,
                run_id: run.id,
                per_page: 100
              });
              const artifact = artifacts.data.artifacts.find(item =>
                item.name === 'clgb71-original-38layer-ik-spine-json-zip' && !item.expired
              );
              if (!artifact) {
                core.setFailed('The latest successful source run has no retained validated ZIP artifact.');
                return;
              }
              await github.rest.repos.createDispatchEvent({
                ...target,
                event_type: 'sa-clgb71-editor',
                client_payload: {
                  source_repo: 'SpineAnimator/spine-animator-private',
                  artifact_run_id: String(run.id),
                  expected_source_sha: run.head_sha
                }
              });
              core.notice(`Dispatched source run ${run.id} at ${run.head_sha} to the licensed 3Spine Editor gate.`);
              await core.summary
                .addHeading('Licensed 3Spine handoff requested')
                .addList([
                  `Source run: ${run.id}`,
                  `Source SHA: ${run.head_sha}`,
                  `Artifact: ${artifact.name}`,
                  'Target: vladleopold/3Spine-core',
                  'Artistic approval remains separate from technical import/render validation.'
                ])
                .write();
            } catch (error) {
              core.setFailed('Cross-repository source handoff failed: ' + String(error.message || error).slice(0, 300));
            }
