name: One-shot private CLGB71 PSD to Spine IK validation

on:
  push:
    branches:
      - task/clgb71-ik-build-oneshot-20261123
    paths:
      - ci/trigger-clgb71-ik.txt

permissions:
  contents: read

concurrency:
  group: clgb71-ik-oneshot
  cancel-in-progress: false

jobs:
  clgb71-ik-build:
    name: Real CLGB71 PSD → IK Spine ZIP • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-task
        with:
          task: clgb71-ik-build
          ref: main
          rust: false
          source-token: ${{ secrets.SOURCE_REPO_TOKEN }}
