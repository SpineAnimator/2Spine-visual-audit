name: 3Spine web convert queue • public Ubuntu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3spine-web-convert-public.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [3spine-web-convert]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-3spine-web-convert-queue
  cancel-in-progress: false
jobs:
  web-convert:
    name: Convert private inbox and compile Spine on public Ubuntu
    uses: SpineAnimator/sa-psd-tool-runner/.github/workflows/web-convert-public.yml@534c241e831c2cc555d7119acbafdc72f0119660
    secrets: inherit
