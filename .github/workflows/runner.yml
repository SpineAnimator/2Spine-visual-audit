name: Private 2Spine visual-audit executor
on:
  workflow_dispatch:
  repository_dispatch:
    types: [2spine-visual-audit, runner-probe]
permissions:
  contents: read
concurrency:
  group: private-2spine-visual-audit
  cancel-in-progress: false
jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm public ephemeral runner
        run: |
          set -euo pipefail
          echo "Public ephemeral runner allocated: $RUNNER_NAME ($RUNNER_OS)"
          uname -s
  execute-private-checks:
    if: github.event_name != 'repository_dispatch' || github.event.action != 'runner-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private source credential
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Required Actions secret SOURCE_REPO_TOKEN is not configured; private checkout cannot run."
            exit 1
          fi
      - name: Checkout private source from 3Spine-core
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            scripts/audit_clgb71_spine_render.py
            scripts/audit_rendered_frames.py
            scripts/editor_source_color_guard.py
            scripts/create_native_frame_manifest.py
            scripts/verify_selected_rgb_native_evidence.py
            tests/test_audit_clgb71_spine_render.py
            tests/test_create_native_frame_manifest.py
            tests/test_selected_rgb_native_evidence.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run private visual-audit regression tests
        working-directory: private-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=10.3,<14'
          python -m unittest discover -s tests -p 'test_audit_clgb71_spine_render.py'
          python -m unittest discover -s tests -p 'test_selected_rgb_native_evidence.py'
          python -m unittest discover -s tests -p 'test_create_native_frame_manifest.py'
